# gsmacro - built-in EXAMPLE macros (identical to "Examples" in the app).
# These show the format only. They are NOT tuned wall-dash inputs:
# replace the steps with your own reWASD timings.
[settings]
poll_period_us = 500
spin_tail_us = 300
queue_capacity = 2
inter_macro_gap_ms = 10
both_bumpers = latest
left_enabled = true
right_enabled = true
macros_armed = true
chord_button = Square
left_modifier = L1
right_modifier = R1
game_tick_hz = 120

[macro left]
name = Wall dash left (example)
axis LX -1
axis LY 0
press Cross
wait 25
release Cross
wait 25
press Cross
wait 25
release Cross
wait 50
axis-release LX
axis-release LY
wait 17

[macro right]
name = Wall dash right (example)
axis LX 1
axis LY 0
press Cross
wait 25
release Cross
wait 25
press Cross
wait 25
release Cross
wait 50
axis-release LX
axis-release LY
wait 17
