# Pure passthrough: the chord macros are disarmed, Square always reaches the
# game. Use this for the first Live Mode test (setup steps 3-6).
[settings]
macros_armed = false
queue_capacity = 2
inter_macro_gap_ms = 10

[macro left]
name = Left (disarmed)
press Cross
wait 20
release Cross
wait 20

[macro right]
name = Right (disarmed)
press Cross
wait 20
release Cross
wait 20
