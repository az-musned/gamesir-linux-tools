# Back-to-back FIFO: queued macros start the instant the previous one ends
# (0 ms gap) and up to 4 activations may wait. gsmacro still emits a released
# update between macros, but Rocket League samples input every 8.33 ms, so it
# may not see a release that short. Use only if your macros end with nothing
# held, or start with a wait.
[settings]
queue_capacity = 4
inter_macro_gap_ms = 0

[macro left]
name = Zero-gap example left
wait 8.333
axis LX -1
press Cross
wait 16.667
release Cross
axis-release LX
wait 8.333

[macro right]
name = Zero-gap example right
wait 8.333
axis LX 1
press Cross
wait 16.667
release Cross
axis-release LX
wait 8.333
