# Template with every wait a whole number of 120 Hz game ticks (8.333 ms),
# showing every action type. A structure to copy from - not a tuned macro.
[settings]
inter_macro_gap_ms = 8.333
queue_capacity = 2

[macro left]
name = Tick-aligned template left
suppress L1          # hide the held air-roll button while the macro runs
axis LX -1
axis LY 0.5
press Cross
wait 16.667          # 2 ticks
release Cross
wait 8.333           # 1 tick
press Cross
axis R2 1            # throttle full
wait 16.667
release Cross
release L1           # give L1 back to the player
wait 8.333
release-all          # drop every remaining override
wait 8.333

[macro right]
name = Tick-aligned template right
suppress R1
axis LX 1
axis LY 0.5
press Cross
wait 16.667
release Cross
wait 8.333
press Cross
axis R2 1
wait 16.667
release Cross
release R1
wait 8.333
release-all
wait 8.333
